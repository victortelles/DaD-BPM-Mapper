schema: spec-driven

context: |
  Tech stack: Python 3.12, Streamlit, Librosa, NumPy, ffmpeg
  Architecture: Modular (audio_analysis, ui, export, models)
  Testing: Pytest planned (currently unavailable in environment)
  Style: PEP 8, typed Python modules, decoupled UI & analysis core

testing:
  strict_tdd: false
  runner:
    command: "pytest"
    framework: "pytest"
    available: false
  layers:
    unit:
      available: false
      tool: "pytest"
    integration:
      available: false
      tool: "pytest"
    e2e:
      available: false
      tool: null
  coverage:
    available: false
    command: "pytest --cov"
  quality:
    linter:
      available: false
      command: "flake8"
    type_checker:
      available: false
      command: "mypy"
    formatter:
      available: false
      command: "black"

rules:
  proposal:
    - Include rollback plan for risky changes
    - Validate Dead as Disco BeatWarping JSON format against game expectations
    - Detail audio conversion requirements (ogg 44.1kHz) and offset handling
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Clearly specify BeatWarping bpmSections structure (startTime, startBeat, bpm)
  design:
    - Keep audio analysis logic decoupled from Streamlit UI
    - Include sequence diagrams for audio processing and export flows
    - Document data model schemas for song metadata and bpmSections
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns and modular architecture
    tdd: false
    test_command: "pytest"
  verify:
    test_command: "pytest"
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
